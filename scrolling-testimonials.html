<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Testimonials | AK&amp;CO</title>
    <link rel="stylesheet" href="assets/scrolling-testimonials.css">
    <script src="assets/scrolling-testimonials.js" defer></script>
    <style>body { margin: 0; background: #0a1429; }</style>
  </head>
  <body>
    <main>
      <akco-testimonials class="akco-testimonials" id="customer-reviews" role="region" aria-labelledby="customer-reviews-title">
        <div class="akco-testimonials-header">
          <h2 id="customer-reviews-title">Scents worth <em>talking about.</em></h2>
        </div>
        <div class="akco-testimonials-viewport" id="customer-reviews-track" role="group" aria-label="Scrollable reviews" tabindex="0">
          <div class="akco-testimonials-track">
            <div class="akco-testimonials-group">
              <div class="akco-testimonials-slot">
                <figure class="akco-testimonials-card">
                  <figcaption class="akco-testimonials-attribution">
                    <img class="akco-testimonials-image" src="images/featured-glass-amber.webp" width="50" height="50" loading="lazy" alt="">
                    <div><strong>Priya S.</strong><span>Royal Amber · Sample review</span></div>
                  </figcaption>
                  <span class="akco-testimonials-quote-mark" aria-hidden="true">“</span>
                  <blockquote>Warm from the first spray. The amber softens as it settles and feels even better close to the skin.</blockquote>
                </figure>
              </div>
              <div class="akco-testimonials-slot">
                <figure class="akco-testimonials-card">
                  <figcaption class="akco-testimonials-attribution">
                    <img class="akco-testimonials-image" src="images/featured-glass-ocean.webp" width="50" height="50" loading="lazy" alt="">
                    <div><strong>Arjun M.</strong><span>Ocean Breeze · Sample review</span></div>
                  </figcaption>
                  <span class="akco-testimonials-quote-mark" aria-hidden="true">“</span>
                  <blockquote>Fresh and airy, like opening the windows first thing in the morning. It’s an easy one to reach for.</blockquote>
                </figure>
              </div>
              <div class="akco-testimonials-slot">
                <figure class="akco-testimonials-card">
                  <figcaption class="akco-testimonials-attribution">
                    <img class="akco-testimonials-image" src="images/p1.webp" width="50" height="50" loading="lazy" alt="">
                    <div><strong>Meera R.</strong><span>Sandalwood · Sample review</span></div>
                  </figcaption>
                  <span class="akco-testimonials-quote-mark" aria-hidden="true">“</span>
                  <blockquote>A little on each wrist is enough. The sandalwood has a quiet warmth that stays close.</blockquote>
                </figure>
              </div>
              <div class="akco-testimonials-slot">
                <figure class="akco-testimonials-card">
                  <figcaption class="akco-testimonials-attribution">
                    <img class="akco-testimonials-image" src="images/p3.webp" width="50" height="50" loading="lazy" alt="">
                    <div><strong>Karthik V.</strong><span>Black Oud · Sample review</span></div>
                  </figcaption>
                  <span class="akco-testimonials-quote-mark" aria-hidden="true">“</span>
                  <blockquote>Deep and woody with a smoky finish. It feels right for a dinner out.</blockquote>
                </figure>
              </div>
              <div class="akco-testimonials-slot">
                <figure class="akco-testimonials-card">
                  <figcaption class="akco-testimonials-attribution">
                    <img class="akco-testimonials-image" src="images/featured-glass-lavender.webp" width="50" height="50" loading="lazy" alt="">
                    <div><strong>Ananya D.</strong><span>Floral Dream · Sample review</span></div>
                  </figcaption>
                  <span class="akco-testimonials-quote-mark" aria-hidden="true">“</span>
                  <blockquote>Soft and floral, with the freshness of a bunch of flowers just brought home.</blockquote>
                </figure>
              </div>
              <div class="akco-testimonials-slot">
                <figure class="akco-testimonials-card">
                  <figcaption class="akco-testimonials-attribution">
                    <img class="akco-testimonials-image" src="images/p2.webp" width="50" height="50" loading="lazy" alt="">
                    <div><strong>Nisha K.</strong><span>Vanilla Noir · Sample review</span></div>
                  </figcaption>
                  <span class="akco-testimonials-quote-mark" aria-hidden="true">“</span>
                  <blockquote>The vanilla feels mellow and warm. I’d wear this with my favourite sweater on a rainy evening.</blockquote>
                </figure>
              </div>
            </div>
          </div>
        </div>
      </akco-testimonials>
    </main>
  </body>
</html>
