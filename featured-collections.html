<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Featured Collections | AK&amp;CO</title>
    <link rel="stylesheet" href="cart.css">
    <style>
:root {
  --shop-ink: #1a1a1a;
  --shop-muted: #65675d;
  --shop-gold: #8b6220;
  --serif: Georgia, serif;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body { margin: 0; color: var(--shop-ink); font: 1rem/1.55 Arial, sans-serif; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--shop-gold); outline-offset: 3px; }
[hidden] { display: none !important; }
.featured-collections {
  --featured-card-width: min(400px, 40cqw);
  --collections-background: #f6f3ee;
  container-type: inline-size;
  background: var(--collections-background);
}
@media (max-width: 760px) {
  .featured-collections { --featured-card-width: min(400px, 82cqw); }
}

.collections-layout {
  --collections-column-gap: clamp(24px, 4vw, 68px);
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
  align-items: center;
  gap: var(--collections-column-gap);
  padding-block: clamp(32px, 6svh, 64px) clamp(20px, 4svh, 48px);
}
.collections-intro { padding-inline-start: clamp(20px, 3.5vw, 64px); }
.collections-intro h2 {
  margin: 0;
  font-size: clamp(28px, 4.4vw, 76px);
  line-height: 1;
  letter-spacing: -.045em;
  text-transform: uppercase;
}
.collections-intro p { max-width: 34ch; color: var(--shop-muted); }
.collections-shop {
  display: inline-block;
  padding: 14px 22px;
  border-radius: 999px;
  background: var(--shop-ink);
  color: white;
}
.collections-rail {
  position: relative;
  overflow-x: auto;
  scroll-behavior: auto;
  overscroll-behavior-x: contain;
  padding-bottom: 8px;
  scrollbar-width: none;
}
.collections-rail::-webkit-scrollbar { display: none; }
.collections-cards {
  display: flex;
  inline-size: max-content;
  gap: 16px;
  background: var(--collections-background);
}
.collections-card {
  position: relative;
  display: grid;
  align-items: end;
  flex: 0 0 var(--featured-card-width);
  min-width: 0;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  border-radius: 22px;
  background: #26353f;
  color: white;
}
.collections-product {
  position: absolute;
  inset: 0;
}
.collections-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.collections-details {
  position: relative;
  display: grid;
  gap: 8px;
  padding: 28px clamp(12px, 1.6vw, 20px) clamp(12px, 1.6vw, 20px);
  background: linear-gradient(transparent, rgb(9 12 17 / 94%) 80%);
  pointer-events: none;
}
.collections-name { font: 400 clamp(1.125rem, 2.8vw, 2.25rem)/1.1 var(--serif); }
.collections-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
}
.collections-price { font-weight: 600; }
.collections-add {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  margin-inline-start: auto;
  padding: 8px 14px;
  border: 1px solid rgb(255 255 255 / 75%);
  border-radius: 999px;
  background: linear-gradient(155deg, white, #f6ebe0);
  color: #1a1a1a;
  font: 600 .75rem/1.2 Arial, sans-serif;
  letter-spacing: .03em;
  white-space: nowrap;
  box-shadow: inset 0 1px 4px white, 0 3px 10px rgb(0 0 0 / 25%);
  cursor: pointer;
  pointer-events: auto;
}
.collections-add:hover { background: white; }
.collections-bag-icon {
  position: relative;
  flex: 0 0 14px;
  height: 13px;
  margin-top: 3px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
}
.collections-bag-icon::before {
  content: "";
  position: absolute;
  inset: -5px 3px auto;
  height: 6px;
  border: 1.5px solid currentColor;
  border-bottom: 0;
  border-radius: 5px 5px 0 0;
}
.collections-wishlist {
  position: absolute;
  inset-block-start: 12px;
  inset-inline-end: 12px;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  cursor: pointer;
  border: 1px solid rgb(255 255 255 / 30%);
  background: linear-gradient(145deg, rgb(255 255 255 / 12%), rgb(6 12 17 / 24%));
  background-clip: padding-box;
  color: #f5f4f0;
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
}
.collections-wishlist:hover { border-color: rgb(255 255 255 / 70%); }
.collections-wishlist[aria-pressed="true"] { background: var(--shop-ink); color: white; }
.collections-wishlist svg {
  width: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 1px 2px rgb(3 18 6 / 80%));
}
.collections-wishlist[aria-pressed="true"] svg { fill: currentColor; }
.collections-rail:focus-visible, .collections-product:focus-visible,
.collections-add:focus-visible, .collections-wishlist:focus-visible {
  outline: 2px solid var(--shop-gold);
  outline-offset: -3px;
}
@media (width > 760px) {
  .collections-intro { grid-area: 1 / 1; }
  .collections-shop:focus-visible { position: relative; z-index: 1; }
  .collections-rail {
    grid-area: 1 / 1 / 2 / -1;
    /* Start in the second column, then let the cards scroll over the title. */
    padding-inline-start: calc((100% - var(--collections-column-gap)) * .4 + var(--collections-column-gap));
    pointer-events: none;
  }
  .collections-cards { pointer-events: auto; }
}
@media (width > 760px) and (prefers-reduced-motion: no-preference) {
  .collections-intro > :not(:focus-visible) { filter: blur(var(--collections-blur, 0px)); }
}
@media (max-width: 760px) {
  .collections-layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .collections-intro, .collections-rail { padding-inline: 20px; }
}
    </style>
  </head>
  <body>
    <section class="featured-collections" aria-labelledby="featured-collections-title" hidden>
      <div class="collections-layout">
        <div class="collections-intro">
          <h2 id="featured-collections-title">Featured Collections</h2>
          <p>Explore fragrances and attars from AK &amp; Co.</p>
          <a class="collections-shop" href="shop.html#collection">Shop new arrivals</a>
        </div>
        <div class="collections-rail" role="region" aria-label="Browse featured fragrances and attars" tabindex="0">
          <div class="collections-cards"></div>
        </div>
      </div>
    </section>
    <script src="product-data.js"></script>
    <script src="cart.js"></script>
    <script>
const products = window.AKCO.products;
const formatter = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 });
const wishlistKey = "akco-wishlist";
const wishlist = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(wishlistKey));
  if (Array.isArray(saved)) saved.forEach((id) => wishlist.add(id));
} catch {
  // The wishlist is still usable for this visit.
}

function productImageUrl(filename) {
  return `${window.AKCO.imageBase}${encodeURIComponent(filename)}`;
}

function renderFeaturedCollections() {
  const section = document.querySelector(".featured-collections");
  const rail = section.querySelector(".collections-rail");
  const cards = rail.querySelector(".collections-cards");
  const ids = ["amber-coffee", "vampire-blood", "royal-amber", "musk-bloom", "sandalwood", "black-oud", "amber-essence"];
  const lineup = ids.map((id) => products.find((product) => product.id === id)).filter(Boolean);
  if (!lineup.length) return;

  for (const product of lineup) {
    const card = document.createElement("article");
    card.className = "collections-card";
    const link = document.createElement("a");
    link.className = "collections-product";
    link.href = `product.html?id=${encodeURIComponent(product.id)}`;
    link.setAttribute("aria-label", `View ${product.name} details`);

    const image = document.createElement("img");
    image.src = productImageUrl(product.image);
    image.alt = "";
    image.loading = "lazy";

    const details = document.createElement("div");
    details.className = "collections-details";
    const name = document.createElement("span");
    name.className = "collections-name";
    name.textContent = product.name;
    const price = document.createElement("span");
    price.className = "collections-price";
    price.textContent = formatter.format(product.price);
    link.append(image);

    const favorite = document.createElement("button");
    favorite.className = "collections-wishlist";
    favorite.type = "button";
    favorite.setAttribute("aria-label", `Wishlist for ${product.name}`);
    favorite.setAttribute("aria-pressed", String(wishlist.has(product.id)));
    favorite.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.2-8.8 10-8.8 10s-8.8-4.8-8.8-10A4.8 4.8 0 0 1 12 6.4a4.8 4.8 0 0 1 8.8 2.4Z"/></svg>';
    favorite.addEventListener("click", () => {
      if (wishlist.has(product.id)) wishlist.delete(product.id);
      else wishlist.add(product.id);
      favorite.setAttribute("aria-pressed", String(wishlist.has(product.id)));
      try {
        localStorage.setItem(wishlistKey, JSON.stringify([...wishlist]));
      } catch {
        // Preserve the current selection when storage is unavailable.
      }
    });

    const actions = document.createElement("div");
    actions.className = "collections-actions";
    const addButton = document.createElement("button");
    addButton.className = "collections-add";
    addButton.type = "button";
    addButton.innerHTML = '<span class="collections-bag-icon" aria-hidden="true"></span>Add to cart';
    addButton.setAttribute("aria-label", `Add ${product.name} to cart`);
    addButton.addEventListener("click", () => {
      window.AKCO.cart.add([{
        id: product.id,
        size: Number.parseInt(product.size, 10),
        price: product.price,
        quantity: 1,
      }]);
    });
    actions.append(price, addButton);
    details.append(name, actions);
    card.append(link, details, favorite);
    cards.append(card);
  }
  section.hidden = false;

  rail.addEventListener("scroll", () => {
    const blur = Math.min(Math.abs(rail.scrollLeft) / 50, 5);
    section.style.setProperty("--collections-blur", `${blur}px`);
  }, { passive: true });
}

renderFeaturedCollections();
    </script>
  </body>
</html>
